name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Cancels superseded runs on the same branch, so a quick follow-up push does not
# queue behind a run whose result no longer matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only, and set explicitly rather than inherited. A workflow with no
# `permissions:` block gets whatever the repository default is, which can be
# read and write for every scope — far more than CI needs, and granted to every
# step including third-party actions. Nothing here writes to the repository:
# it checks out, installs, typechecks, tests, builds and packs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # One failing version should still report the others, rather than
      # cancelling them and hiding whether the break is version-specific.
      fail-fast: false
      matrix:
        # 22 is the version used for development; 24 catches breakage on current
        # before it becomes the default everywhere.
        node-version: [ '22.x', '24.x' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # `ci` rather than `install`: it installs exactly what the lockfile
      # records and fails if the two have drifted.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Catches packaging faults that neither the build nor the tests would:
      # a stray file entering the tarball, or `files`/`exports` pointing at
      # something the build no longer produces.
      - name: Verify the package contents
        run: npm pack --dry-run

      # Compiles a throwaway consumer against the packed tarball under
      # `moduleResolution: nodenext` with `skipLibCheck: false`.
      #
      # Neither `typecheck` nor `build` can see what this sees. `tsconfig.json`
      # sets `moduleResolution: "Bundler"`, which permits extensionless
      # relative imports, and `skipLibCheck: true`, which stops us compiling
      # our own declarations — so four releases shipped `.d.ts` files that no
      # consumer on node16/nodenext could compile, and it surfaced only
      # downstream (#85). This is the position that reproduces it.
      - name: Check the shipped declarations compile
        run: npm run check:dist-types
