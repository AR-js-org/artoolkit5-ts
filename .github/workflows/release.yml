name: Release

# Triggered by pushing a release tag on `main`. The tag is the instruction: this
# workflow creates the GitHub Release for it and publishes the package, and it
# does nothing else — no version bump, no changelog promotion, no commit, and no
# push to any branch.
#
# That is the point of the rewrite (#22, #86). This workflow used to be a
# dispatch that committed the version bump and pushed it straight to `main` with
# the GITHUB_TOKEN. A repository ruleset cannot exempt that push — GitHub
# refuses GitHub Actions as a bypass actor, and the GITHUB_TOKEN cannot bypass a
# pull-request rule — so `main` here had to go without the pull-request rule
# every other AR-js-org repository has. Nothing pushes to `main` any more, so
# the rule can go back on. Tags are not subject to the ruleset.
#
# The version bump now arrives the ordinary way, as a release pull request into
# `dev`. See MAINTAINERS.md; the process is the one in
# AR-js-org/arjs-dev-tools#8, with arjs-plugin-artoolkit as its reference
# implementation.
#
# Publishing stays in this file rather than moving to a separate `publish.yml`
# as the reference does. The reference splits them so a failed npm publish does
# not also lose the Release's build assets — and this Release carries no assets,
# only notes, so the split would buy nothing here while requiring a second npm
# trusted publisher entry. npm authorises per workflow *filename*, and the entry
# for this repository names `release.yml`.
#
# It is two *jobs*, and the division is now structural rather than a flag.
# Everything irreversible lives in `release`, gated on
# `github.ref_type == 'tag'`. A `workflow_dispatch` therefore cannot publish —
# not "must remember to pass dry_run", but cannot, because a dispatch runs
# against a branch and the job is skipped for it. A step added to `release`
# inherits that, which is the failure the old `dry_run` input invited: someone
# adds a publish target, forgets its `if:`, and a dry run publishes anyway. npm
# never allows a version to be replaced, so that mistake was unrecoverable.
on:
  push:
    tags:
      - 'v*.*.*'
  # Verification only, and structurally incapable of anything else: every check
  # below runs against the dispatched ref and the `release` job is skipped. Use
  # it to ask "would this tree release cleanly" before tagging.
  workflow_dispatch:

# Two releases at once would race over the Release and the registry, and the
# other publisher is `publish-tag.yml`, so the group is shared with it and keyed
# on the package rather than the workflow. Keep this string identical in both
# files — that it matches is the whole mechanism (#82).
#
# Serialising is not queueing: a group holds one run and one pending run, and a
# third request cancels the pending one and takes its place. See the longer note
# in `publish-tag.yml`, and "Known failure modes" in MAINTAINERS.md.
#
# Never `cancel-in-progress`: cancelling a run that has already published leaves
# a version on npm that npm will not let be replaced. Letting it finish is the
# only safe behaviour — "queueing" would overclaim the same way the comment this
# replaces did.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

# One definition of "this run releases something", so the `release` job's gate
# and everything `verify` says about itself cannot disagree. `ref_type` alone is
# not enough: a dispatch may name a tag as its ref.
env:
  IS_RELEASE: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}

jobs:
  # Everything that can fail safely. Nothing here leaves the runner: no Release,
  # no package. A dispatch ends when this job does.
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Pinned to the commit the event names rather than to a branch tip, so
          # the release job publishes exactly what was verified here. For a tag
          # push this is the tagged commit.
          ref: ${{ github.sha }}
          # Full history and tags: the release notes are derived from the
          # commits since the previous tag, and a shallow clone has neither.
          fetch-depth: 0

      # One step, two cases, decided in bash rather than through a step-level
      # `if:`. A tag is a claim about which version is being released, so it is
      # checked against the manifest; a dispatch makes no such claim, and reads
      # the manifest instead.
      - name: Resolve the version
        id: resolve
        run: |
          ACTUAL="$(node -p "require('./package.json').version")"

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"

            # Anchored to the whole string with bash's own `=~` rather than
            # piped through grep: grep is line-oriented, so a multi-line value
            # matches on its first line and passes — and the GITHUB_ENV write
            # below would then add a second environment record for every later
            # step. A git ref cannot contain a newline, so this is belt and
            # braces; the braces cost one line.
            SEMVER='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
            if ! [[ "$VERSION" =~ $SEMVER ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not name a version. Expected vX.Y.Z, optionally with a prerelease suffix."
              exit 1
            fi

            # The tag names what is published, so a disagreement means the wrong
            # tree — and this is what stands between a stray tag and a publish,
            # now that the tag is the trigger. Releasing a version nobody
            # prepared requires a commit that sets it.
            if [ "$VERSION" != "$ACTUAL" ]; then
              echo "::error::Tag $GITHUB_REF_NAME implies version $VERSION but package.json says $ACTUAL. The tag does not point at that release's commit."
              exit 1
            fi
            # Keyed on the ref type, not on IS_RELEASE: a dispatch may name a
            # tag, and checking that tag against the manifest is exactly what
            # someone verifying a tag before pushing it wants. Only whether the
            # run goes on to release differs, so only the wording does.
            if [ "$IS_RELEASE" = true ]; then
              echo "Releasing $VERSION from $GITHUB_REF_NAME."
            else
              echo "Checking tag $GITHUB_REF_NAME without releasing it: this is a dispatch, and only a tag push releases."
            fi
          else
            VERSION="$ACTUAL"
            echo "Verification run on $GITHUB_REF_NAME at package.json's $VERSION. Nothing will be released or published."
          fi

          # GITHUB_ENV for the rest of this job; GITHUB_OUTPUT so the release
          # job can read it, since env does not cross a job boundary.
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Replaces the old "Ensure releases run from main". The branch a dispatch
      # happens to run on no longer decides anything; what matters is that the
      # tag sits on the branch releases are cut from. A tag pushed on a feature
      # branch would otherwise release that branch's tree.
      #
      # `main` is fetched explicitly rather than assumed present, so a missing
      # remote ref reads as a fetch failure instead of silently skipping the
      # check — the shape of mistake that made the old push preflight useless.
      - name: Ensure the tag is on main
        if: ${{ github.ref_type == 'tag' }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME is not an ancestor of origin/main. Release tags are pushed on the merge commit on main — see MAINTAINERS.md. Delete the tag, merge to main, and tag there."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main."

      # 24.x, and not interchangeable with 22.x: trusted publishing needs npm
      # 11.5.1 or newer, and Node 22.x still ships npm 10.9.x. Node 24.x ships
      # 11.19.x, so the requirement is met by the runtime rather than by a
      # global npm install on top of it. Stated in both jobs so the tree is
      # built and published on the same major.
      #
      # `registry-url` is deliberately not set, unlike in npm's own documented
      # example. It makes setup-node write an .npmrc line reading
      # `_authToken=${NODE_AUTH_TOKEN}`; with no token in the environment that
      # expands to empty, npm decides authentication is already configured and
      # never performs the OIDC exchange, failing with 403 or ENEEDAUTH.
      # registry.npmjs.org is npm's default anyway. See actions/setup-node#1551
      # and npm/documentation#1960 before adding it back.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The version is no longer bumped here, so nothing about this step's
      # position is delicate any more. `vite.config.ts` substitutes
      # package.json's version into the bundle, and package.json already carries
      # the released version: it arrived in the release pull request, which is
      # also what the version test in `npm test` above compares against.
      - name: Build
        run: npm run build

      - name: Generate release notes
        run: |
          # Notes come from the commits, so they describe what actually landed
          # rather than what someone remembered to write down. The script
          # resolves the previous tag itself, including the case this trigger
          # introduced, where HEAD is a tag and the nearest tag is therefore
          # itself — see scripts/release-notes.mjs.
          node scripts/release-notes.mjs > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Show what would be published
        run: npm pack --dry-run

      # Handing the built tree to the release job, rather than rebuilding it
      # there, is what makes a verification run meaningful: the tarball that
      # gets published is the one `npm pack --dry-run` just reported on, not a
      # second build that happens to be made from the same sources.
      - name: Stage the release for the publishing job
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.resolve.outputs.version }}
          path: |
            package.json
            package-lock.json
            CHANGELOG.md
            release-notes.md
            dist
          if-no-files-found: error
          # Purely a hand-off between two jobs of one run. A verification run's
          # copy is worth keeping briefly so it can be downloaded and inspected.
          retention-days: 7

      # Unconditional, and says which mode it ran in rather than existing for
      # only one of them. A summary cannot publish anything, so it needs no
      # guard — and a guard here would be one more `if:` to keep correct.
      - name: Summarise
        run: |
          {
            if [ "$IS_RELEASE" = true ]; then
              echo "### Verified $VERSION from $GITHUB_REF_NAME"
              echo ""
              echo "Every check passed. The \`release\` job creates the GitHub Release and publishes."
            else
              echo "### Verification run — nothing was released or published"
              echo ""
              echo "Version \`$VERSION\` on \`$GITHUB_REF_NAME\` passed every check."
              echo ""
              echo "The \`release\` job is skipped for anything that is not a tag push, so nothing"
              echo "left this runner. The staged artifact above is what a tag push would publish."
              if [ "$GITHUB_REF_TYPE" = tag ]; then
                echo ""
                echo "This was dispatched against tag \`$GITHUB_REF_NAME\`. Pushing that tag is what"
                echo "releases it; dispatching against it only checks it."
              fi
            fi
            echo ""
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

  # Everything that cannot be undone. The `if:` below guards the whole job, so a
  # step added here is covered whether or not whoever adds it reads this comment.
  #
  # Both halves are needed, and `ref_type` alone was a real hole: a
  # `workflow_dispatch` may name a **tag** as its ref — "the reference can be a
  # branch or tag name", per the REST reference for the dispatch event — so
  # `gh workflow run release.yml --ref v0.3.1` made `ref_type == 'tag'` true and
  # published from what this workflow advertises as verification-only. Testing
  # the event name is what makes a dispatch incapable of publishing, which is
  # what the comments above claim.
  release:
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}

    runs-on: ubuntu-latest

    permissions:
      # Creating the Release. Nothing is pushed to a branch any more, but
      # `gh release create` writes a release object and needs this.
      contents: write
      # Mints the OIDC token npm authenticates with. This is how the publish
      # identifies itself at all, not only how provenance is attested: there is
      # no npm token in this workflow.
      id-token: write

    env:
      VERSION: ${{ needs.verify.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The same pin as `verify`, for the same reason.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      # npm will not generate provenance for a package built in a private
      # repository, and provenance is not optional here: trusted publishing
      # attests it automatically and there is no flag to drop. First step past
      # the gate, so it fails before the Release is created rather than after.
      - name: Ensure the repository is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh repo view "${{ github.repository }}" --json isPrivate --jq .isPrivate)" = "true" ]; then
            echo "::error::${{ github.repository }} is private, and npm cannot generate provenance from a private repository."
            exit 1
          fi
          echo "Repository is public; provenance can be generated."

      # npm never allows a version to be replaced or reused, so a collision is
      # caught before the Release is created — the Release is the first thing
      # this job does that outlives the run.
      #
      # "Not published" and "registry unreachable" are different facts, and
      # conflating them is what #81 was about in `publish-tag.yml`. `npm view`
      # exits non-zero with `E404` only for a genuine absence; anything else is
      # a lookup that did not answer, and this stops rather than guesses.
      - name: Check the version is not already published
        run: |
          NAME="$(node -p "require('./package.json').name")"
          LOOKUP_ERROR="$(mktemp)"

          if npm view "$NAME@$VERSION" version >/dev/null 2>"$LOOKUP_ERROR"; then
            echo "::error::$NAME@$VERSION is already published. npm versions cannot be replaced, so this tag cannot be released again. If only the GitHub Release is missing, create it by hand."
            exit 1
          fi

          if ! grep -q 'E404' "$LOOKUP_ERROR"; then
            echo "::error::Could not establish whether $NAME@$VERSION is already published. The registry lookup failed for a reason other than the version being absent, so this run cannot tell 'unpublished' from 'unreachable'. Re-run once the registry is reachable."
            echo "npm view wrote:"
            cat "$LOOKUP_ERROR"
            exit 1
          fi

          echo "$NAME@$VERSION is available."

      # No `npm ci` in this job on purpose: publishing needs the manifest and
      # dist/, not the dependency tree, and there are no publish lifecycle
      # scripts to run. Reinstalling would only add a chance for the published
      # tree to differ from the verified one.
      #
      # v8 against upload-artifact's v7 is the matching pair, not a typo: the
      # download side has been one major ahead since its v5, which changed path
      # handling for downloads by *id*. This downloads by name, which that
      # release explicitly left alone.
      - name: Restore the verified release
        uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.verify.outputs.version }}
          path: .prepared

      - name: Apply the verified release over the checkout
        # Extracted to a scratch directory first, rather than unpacked straight
        # over the working tree, so the overwrite is this workflow's decision
        # rather than whatever the download action does with existing paths.
        #
        # Copied wholesale, though, not file by file: the artifact's own `path:`
        # list in `verify` is the single definition of what crosses between the
        # jobs. Re-enumerating it here would mean a file added there silently
        # never arriving.
        run: |
          rm -rf dist
          cp -R .prepared/. .
          rm -rf .prepared

          PACKED="$(node -p "require('./package.json').version")"
          if [ "$PACKED" != "$VERSION" ]; then
            echo "::error::Verified package.json is at $PACKED but this run is releasing $VERSION."
            exit 1
          fi
          echo "Applied the verified tree for $VERSION."

      # `--verify-tag` rather than letting gh invent the tag: with a mistyped or
      # missing tag `gh release create` would otherwise create one at the
      # default branch. The tag is the trigger here, so it exists by
      # construction — but the flag costs nothing and the failure it prevents is
      # a Release pointing at the wrong tree.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag

      # Authenticated by trusted publishing (OIDC), configured against this
      # repository and this workflow filename on npmjs.com. There is no token:
      # the runner exchanges a short-lived OIDC token for publish rights, so
      # there is nothing to expire, rotate or leak, and nothing for the
      # package's 2FA requirement to reject. That requirement is what broke the
      # 0.2.0 and 0.2.1 publishes, both of which had to be completed by hand.
      #
      # --provenance is deliberately absent: publishing this way attests
      # provenance automatically, and passing the flag is redundant.
      #
      # --access public is required for a scoped package; npm otherwise defaults
      # it to restricted.
      #
      # The dist-tag is chosen, not inherited, through the same script
      # `publish-tag.yml` uses. An earlier version of this workflow argued that
      # inheriting `latest` was correct here because a pushed tag is always the
      # newest release. That is wrong twice:
      #
      #   - a **prerelease** tag passes every check above, and `npm publish`
      #     would make `v0.4.0-rc.1` what a plain `npm install` resolves;
      #   - an **older** tag is reachable too. Delete and re-push the tag of a
      #     release whose publish failed, after a newer version shipped, and
      #     this workflow sees an unpublished version on `main` that matches its
      #     manifest — and would point `latest` backwards.
      #
      # `next` as the fallback, npm's convention for a prerelease, rather than
      # `publish-tag.yml`'s `recovered`: reaching the fallback here means the
      # version should not be the default install, not that something is being
      # recovered.
      - name: Decide the dist-tag
        run: |
          DIST_TAG="$(node scripts/dist-tag.mjs "$VERSION" --fallback next)"
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"

      - name: Publish to npm
        run: npm publish --access public --tag "$DIST_TAG"

      - name: Summarise
        run: |
          NAME="$(node -p "require('./package.json').name")"
          {
            echo "### Released $NAME@$VERSION"
            echo ""
            echo "- Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$GITHUB_REF_NAME"
            echo "- npm: https://www.npmjs.com/package/$NAME/v/$VERSION"
            echo "- dist-tag: \`$DIST_TAG\`"
            echo ""
            echo "Published with provenance over OIDC — no token involved."
            echo ""
            if [ "$DIST_TAG" != latest ]; then
              echo "> [!IMPORTANT]"
              echo "> \`latest\` was **not** moved, so a plain \`npm install $NAME\` still resolves"
              echo "> the previous version. Install this one as \`$NAME@$DIST_TAG\`. Remove the tag"
              echo "> once it has served its purpose:"
              echo ">"
              echo "> \`\`\`bash"
              echo "> npm dist-tag rm $NAME $DIST_TAG"
              echo "> \`\`\`"
              echo ""
            fi
            echo "Now re-sync \`dev\` with \`main\`:"
            echo ""
            echo "    git switch dev && git merge --ff-only origin/main && git push"
          } >> "$GITHUB_STEP_SUMMARY"
